name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer le navigateur de test
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Tester l'appli (routes, largeurs, doublons, anciennes données, devis)
        run: node tests/smoke.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Préparer le site (vitrine à la racine, appli dans /app/)
        run: |
          mkdir -p _site/app
          cp -r site/. _site/
          cp app/index.html app/sw.js app/manifest.webmanifest app/icon.svg app/fx-pdf.js app/fx-fonts.js _site/app/
          touch _site/.nojekyll
      - name: Refuser un déploiement avec des informations légales manquantes
        run: |
          if grep -l '\[\[' _site/*.html; then
            echo "::error::Des emplacements [[...]] (nom, SIRET, adresse, e-mail) restent à compléter dans les pages du site."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
