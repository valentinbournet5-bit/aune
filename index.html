<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUNE · Suivi de chantier</title>
<meta name="theme-color" content="#f8f7f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* Blanc cassé + pastels un peu flashy. Une couleur par univers :
   chantiers = lilas · devis = ciel · factures = menthe · alertes = corail · attention = citron */
:root{
  color-scheme:light;
  --bg:#f8f7f3;--card:#fff;--ink:#232733;--muted:#70758a;--line:#ebe8e0;--soft:#f2f0ea;
  --sky:#86c9ff;--mint:#72e3b4;--lilac:#bba3ff;--coral:#ff9d8f;--lemon:#ffdf6b;
  --sky-s:#e4f3ff;--mint-s:#dff8ee;--lilac-s:#ede7ff;--coral-s:#ffeae6;--lemon-s:#fff6d4;
  --sky-d:#0d5a94;--mint-d:#087349;--lilac-d:#5430c4;--coral-d:#b02f24;--lemon-d:#7a5d00;
  --shadow:0 10px 30px -16px rgba(35,39,51,.28);
  --p:var(--ink);--pt:#fff;
}
body[data-sec=chantiers]{--p:var(--lilac);--pt:var(--ink)}
body[data-sec=devis]{--p:var(--sky);--pt:var(--ink)}
body[data-sec=factures]{--p:var(--mint);--pt:var(--ink)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;margin:0;font-weight:750}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:14px}

/* Mise en page : barre latérale (PC) / barre du bas (téléphone) */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 16px 20px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.1em;font-size:20px;padding:0 8px}
.side nav{display:grid;gap:4px}
.nv{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;font-weight:650;color:var(--ink)}
.nv .chip{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.nv:hover{background:var(--soft)}
.nv.on{background:#fff;box-shadow:var(--shadow)}
.nv.set{margin-top:auto;color:var(--muted)}
.ico{width:21px;height:21px;flex:none}
main{padding:34px clamp(18px,4vw,52px) 90px;max-width:1220px;width:100%}
.mtop,.bottom{display:none}

/* Boutons */
.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 18px;cursor:pointer;font-weight:650;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--p);color:var(--pt);border-color:var(--p)}
.btn.sky{background:var(--sky);border-color:var(--sky)}.btn.mint{background:var(--mint);border-color:var(--mint)}.btn.lilac{background:var(--lilac);border-color:var(--lilac)}
.btn.link{border:0;background:none;text-decoration:underline;padding:10px 4px}
.btn.danger{color:var(--coral-d)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:12px}
.icon-btn{border:0;background:none;cursor:pointer;font-size:24px;line-height:1;padding:6px 10px;border-radius:10px;color:var(--muted)}
.icon-btn:hover{color:var(--coral-d);background:var(--coral-s)}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.head .sub{color:var(--muted);margin-top:6px}
.head .sub::first-letter{text-transform:uppercase}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{display:flex;justify-content:space-between;align-items:center;margin:30px 0 12px}
.sec:first-child{margin-top:0}
.count{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:13px;font-weight:700}
.back{display:inline-block;margin-bottom:14px;color:var(--muted);font-weight:650}
.cols2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:28px;align-items:start}
.cols2.eq{grid-template-columns:1fr 1fr}
.stack{display:grid;gap:14px}

/* Tuiles d'action */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.tile{border:0;border-radius:24px;padding:18px 20px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;color:var(--ink);box-shadow:var(--shadow);min-height:88px}
.tile .plus{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:28px;font-weight:600;flex:none}
.tile b{display:block;font-size:19px}
.tile .ts{font-size:14px;opacity:.75}
.tile.sky{background:var(--sky)}.tile.mint{background:var(--mint)}.tile.lilac{background:var(--lilac)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.kpis.three{grid-template-columns:repeat(3,1fr);margin-bottom:22px}
.kpi{border-radius:18px;padding:14px 16px;display:block}
.kpi span{font-size:14px;opacity:.78}
.kpi b{display:block;font-size:23px;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi.sky{background:var(--sky-s)}.kpi.mint{background:var(--mint-s)}.kpi.lilac{background:var(--lilac-s)}.kpi.coral{background:var(--coral-s)}.kpi.lemon{background:var(--lemon-s)}

/* Listes */
.list,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.list{overflow:hidden}
.card{padding:20px}
.row{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);min-height:68px}
.row:first-child{border-top:0}
a.row:hover{background:var(--bg)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s,.s{color:var(--muted);font-size:14px}
.row .amt{font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--ink);flex:none}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:700;background:var(--soft);color:var(--muted);border:0;white-space:nowrap}
.pill.info{background:var(--sky-s);color:var(--sky-d)}.pill.ok{background:var(--mint-s);color:var(--mint-d)}
.pill.warn{background:var(--lemon-s);color:var(--lemon-d)}.pill.bad{background:var(--coral-s);color:var(--coral-d)}
button.pill{cursor:pointer}
button.pill:hover{filter:brightness(.96)}
.bar2{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:10px}
.bar2 i{display:block;height:100%;background:var(--mint);border-radius:99px}

/* Cartes chantier */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ccard{display:block;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.ccard:hover{border-color:var(--ink)}
.ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cname{font-size:18px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
.cfoot{margin-top:8px}

/* Page chantier */
.hero{background:var(--lilac-s);border:1px solid color-mix(in srgb,var(--lilac) 55%,#fff);border-radius:26px;padding:20px 24px 22px;margin-bottom:26px}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hero-top .back{margin:0}
.hero-main{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero-main .av{width:58px;height:58px;border-radius:18px;font-size:20px;background:var(--lilac)}
.hero-main>div{flex:1;min-width:200px}
.hero .bar2{background:rgba(255,255,255,.75);height:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chips a,.chips span{background:rgba(255,255,255,.8);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600}
.stats{display:grid}
.stats div{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stats div:first-child{border-top:0;padding-top:0}
.stats div:last-child{padding-bottom:0}
.stats b{font-variant-numeric:tabular-nums;font-size:17px}

.empty{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.notice{background:var(--lemon-s);border-radius:16px;padding:12px 18px;margin-bottom:22px;font-weight:550}
.search{width:100%;max-width:420px;margin-bottom:18px}
[hidden]{display:none!important}
.warnbox{background:var(--lemon-s);color:var(--lemon-d);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:650;margin-top:14px}

/* Formulaires */
input:not([type]),input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-width:0;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:0}
textarea{resize:vertical}
label.f{display:grid;gap:5px;font-size:14px;color:var(--muted);font-weight:550}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
details.more>summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.more>summary::before{content:"+";display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--lemon);font-weight:800}
details.more[open]>summary::before{content:"–"}
details.more>summary::-webkit-details-marker{display:none}
dialog{border:0;border-radius:26px;background:var(--bg);color:var(--ink);padding:0;width:min(540px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 30px 80px -20px rgba(35,39,51,.5)}
dialog::backdrop{background:rgba(35,39,51,.45)}
.dform{padding:24px;display:grid;gap:18px}
.dform h2{font-size:21px;font-weight:800}
.frow{display:flex;justify-content:flex-end;gap:10px}

/* Éditeur de devis / facture */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"info side" "lines side" "opts side";gap:18px 28px;align-items:start}
.e-info{grid-area:info}.e-lines{grid-area:lines;container-type:inline-size}
@container (max-width:560px){
  .line{grid-template-columns:1fr 1fr 1fr}
  .line .lt{grid-column:1/3;text-align:left}
  .line .icon-btn{justify-self:end}
}.e-side{grid-area:side;position:sticky;top:24px}.e-opts{grid-area:opts}
.line{display:grid;grid-template-columns:80px 92px 120px minmax(0,1fr) 40px;gap:10px;align-items:end;padding:14px;border-radius:16px;background:var(--bg);margin-bottom:10px}
.line>*{min-width:0}
.line .desc{grid-column:1/-1;background:#fff}
.line .lt{white-space:nowrap;text-align:right;align-self:center;font-weight:750;font-size:17px;font-variant-numeric:tabular-nums}
.line .icon-btn{align-self:center}
.mini{display:grid;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.mini input{background:#fff}
.row .rside{display:grid;justify-items:end;gap:4px}
.racts{display:flex;gap:8px;align-items:center}
.tot{display:grid;gap:8px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-size:28px;font-weight:800;letter-spacing:-.02em;border-top:2px solid var(--ink);padding-top:12px;margin-top:4px}
.sumcard{background:var(--p);border-color:var(--p)}
body:not([data-sec]) .sumcard,body[data-sec=chantiers] .sumcard{background:#fff;border-color:var(--line)}
.sumtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:700}
.actions{display:grid;gap:10px;margin-top:20px}
.actions .btn{width:100%}
.sumcard .btn{background:#fff;border-color:transparent}
.sumcard .btn.primary{background:var(--ink);color:#fff}
.sumcard .tot .big{border-color:var(--ink)}

/* Planning */
.gantt{overflow:auto;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.g{display:grid;grid-template-columns:160px 1fr;min-width:780px;border-top:1px solid var(--line)}
.g:first-child{border-top:0}
.gl{position:sticky;left:0;z-index:2;background:var(--card);padding:9px 14px;font-size:14px;border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl.c{font-weight:750;background:var(--lilac-s)}
.gw{display:grid;grid-template-columns:repeat(8,1fr);font-size:13px;color:var(--muted)}
.gw span{padding:9px 8px;border-left:1px solid var(--line)}
.gt{position:relative;min-height:38px;background:repeating-linear-gradient(to right,transparent 0,transparent calc(12.5% - 1px),var(--line) calc(12.5% - 1px),var(--line) 12.5%)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--coral);z-index:1}
.gb{position:absolute;top:9px;height:20px;border-radius:7px;min-width:8px}
.gb.c{top:16px;height:6px;background:var(--ink)!important}
.gb.done{opacity:.4}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;z-index:50;font-weight:650}
#print{display:none}

/* Fenêtre moyenne : la barre latérale se réduit aux icônes pour laisser la place au contenu */
@media (min-width:821px) and (max-width:1239px){
  .shell{grid-template-columns:86px minmax(0,1fr)}
  .side{padding:22px 0;align-items:center;gap:20px}
  .side .lb{display:none}
  .logo{padding:0}
  .nv{padding:6px;justify-content:center}
  main{padding-left:clamp(18px,3vw,40px);padding-right:clamp(18px,3vw,40px)}
}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols2,.cols2.eq{grid-template-columns:minmax(0,1fr)}
  .editor{grid-template-columns:minmax(0,1fr);grid-template-areas:"info" "lines" "side" "opts"}
  .e-side{position:static}
}
@media (max-width:820px){
  .shell{display:block}
  .side{display:none}
  .mtop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0}
  .mtop .gear{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--line)}
  .bottom{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:#fff;border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 14px 40px -12px rgba(35,39,51,.4)}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;font-size:12px;font-weight:650;color:var(--muted)}
  .bottom .ib{padding:4px 18px;border-radius:99px;display:grid;place-items:center}
  .bottom a.on{color:var(--ink)}
  .bottom a.on .ib{background:var(--c)}
  main{padding:18px 16px 120px}
  h1{font-size:26px}
  .quick{grid-template-columns:1fr}
  .tile{min-height:72px}
  .kpis.three{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .line{grid-template-columns:1fr 1fr 1fr;padding:12px}
  .line .lt{grid-column:1/3;text-align:left}
  .line .icon-btn{justify-self:end}
  .row{flex-wrap:wrap}
  .racts{flex:0 0 100%;justify-content:flex-end}
  .hero{padding:16px}
}
/* Animations : discrètes, et seulement si le système ne demande pas de les réduire */
@media (prefers-reduced-motion:no-preference){
  .tile,.ccard,.btn,.nv,.row,.pill,.icon-btn{transition:transform .14s ease,border-color .14s ease,background-color .14s ease,box-shadow .14s ease}
  .tile:hover{transform:translateY(-2px)}
  .ccard:hover{transform:translateY(-2px)}
  .btn:active,.tile:active,.ccard:active,button.pill:active{transform:scale(.97)}
  /* un seul mouvement d'ensemble quand on change de page */
  main.enter{animation:enter .3s cubic-bezier(.2,.7,.2,1)}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}}
  main.enter .bar2 i{transform-origin:left;animation:grow .8s .12s cubic-bezier(.2,.7,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}}
  /* réponses à une action */
  dialog[open]{animation:dlg .24s cubic-bezier(.2,.8,.2,1)}
  dialog[open]::backdrop{animation:fade .24s ease-out}
  @keyframes dlg{from{opacity:0;transform:translateY(16px) scale(.97)}}
  @keyframes fade{from{opacity:0}}
  .pop{animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
  @keyframes pop{from{transform:scale(.7)}}
  .line.pop{animation:slidein .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes slidein{from{opacity:0;transform:translateY(-8px)}}
  .toast{animation:up .2s ease-out}
  @keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
}
@media print{
  body{background:#fff}
  .shell,.bottom,dialog,.toast{display:none!important}
  #print{display:block!important;color:#000;background:#fff;font:12.5px/1.45 system-ui,sans-serif}
}
#print .pg{max-width:780px;margin:0 auto}
#print table{width:100%;border-collapse:collapse;margin:18px 0}
#print th{text-align:left;border-bottom:2px solid #000;padding:6px 4px;font-size:12px}
#print td{border-bottom:1px solid #ccc;padding:7px 4px;vertical-align:top}
#print .r{text-align:right}
#print .hd{display:flex;justify-content:space-between;gap:24px}
#print h1{font-size:30px}
#print .sig{border:1px solid #000;height:90px;padding:6px;margin-top:20px;width:55%}
#print .tt{margin-left:auto;width:260px}
#print .tt div{display:flex;justify-content:space-between;padding:3px 0}
#print .tt .g2{border-top:2px solid #000;font-weight:700;font-size:15px;margin-top:4px;padding-top:6px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div>
    <div class="mtop" id="mtop"></div>
    <main id="main"></main>
  </div>
</div>
<nav class="bottom" id="bottom"></nav>
<dialog id="dlg"></dialog>
<div id="print"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============ Utilitaires ============ */
const $=(s,el=document)=>el.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const LS='aune.v1', DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
const D=s=>Date.parse(s+'T00:00:00Z');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const addDays=(s,n)=>new Date(D(s)+n*DAY).toISOString().slice(0,10);
const weekStart=s=>addDays(s,-((new Date(D(s)).getUTCDay()+6)%7));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const fdate=s=>s?new Date(D(s)).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}):'—';
const fshort=s=>s?new Date(D(s)).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',timeZone:'UTC'}):'';
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const hue=s=>{let h=0;for(const c of String(s||'x'))h=(h*31+c.charCodeAt(0))%360;return h};
const colorOf=s=>`hsl(${hue(s)} 85% 76%)`;
const PAL=['sky','mint','lilac','coral','lemon'];
const palOf=s=>PAL[hue(s)%5];
const initials=s=>{
  const skip=/^(m|mr|mme|mlle|me|et|de|du|des|la|le|les|d|l)\.?$/i;
  let w=String(s||'').split(/[\s/·\-]+/).filter(x=>/^[A-Za-zÀ-ÿ0-9]/.test(x)&&!skip.test(x));
  if(!w.length)w=String(s||'?').split(/\s+/).filter(Boolean);
  const r=w.length>1?w[0][0]+w[1][0]:(w[0]||'?').slice(0,2);
  return r.toUpperCase();
};

function form(title,fields,vals,onSave,openMore){

    if(d.status==='brouillon')return pdfP+b('envoyé','Marquer comme envoyé');

    return b('brouillon','Rouvrir en brouillon')+pdf;
  }

  if(d.status==='envoyée')return b('payée','Marquer comme payée','primary')+pdf;
  return pdf;
}

function vPlanning(){
  const ws=addDays(weekStart(today()),-7+ui.goff*28),days=56;
  const weeks=[...Array(8)].map((_,i)=>addDays(ws,i*7));
  const tl=((D(today())-D(ws))/DAY+.5)/days*100;
  const track=inner=>`<div class="gt">${tl>=0&&tl<=100?`<i class="gtoday" style="left:${tl}%"></i>`:''}${inner}</div>`;
  const bar=(s,e,color,cls,title)=>{
    s=s||e;e=e||s;if(!s)return'';let l=(D(s)-D(ws))/DAY,w=(D(e)-D(s))/DAY+1;
    if(l+w<=0||l>=days)return'';if(l<0){w+=l;l=0}if(l+w>days)w=days-l;
    return `<div class="gb ${cls}" title="${esc(title)}" style="left:${l/days*100}%;width:${w/days*100}%;background:${color}"></div>`;
  };
  let rows='';
  db.chantiers.filter(c=>c.status!=='terminé'&&(!ui.gc||c.id===ui.gc)).forEach(c=>{
    const ls=lotsOf(c);if(!ls.length&&!c.start&&!c.end)return;
    rows+=`<div class="g"><div class="gl c"><a href="#/chantier/${c.id}">${esc(c.name)}</a></div>${track(bar(c.start,c.end,'var(--ink)','c',c.name))}</div>`;
    ls.forEach(l=>{rows+=`<div class="g"><div class="gl">${esc(l.trade)}</div>${track(bar(l.start,l.end,colorOf(l.trade),l.status==='terminé'?'done':'',l.trade+' · '+(l.company||'')))}</div>`});
  });
  return `<a class="back" href="#/chantiers">← Chantiers</a>`+head('Planning',`${fdate(ws)} → ${fdate(addDays(ws,days-1))}`,
    `<select id="gsel" aria-label="Filtrer par chantier" style="width:auto"><option value="">Tous les chantiers</option>${db.chantiers.map(c=>`<option value="${c.id}" ${ui.gc===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
     <button class="btn" data-a="gprev" aria-label="Période précédente">←</button><button class="btn" data-a="gtoday">Aujourd'hui</button><button class="btn" data-a="gnext" aria-label="Période suivante">→</button>`)+
  (rows?`<div class="gantt"><div class="g"><div class="gl"></div><div class="gw">${weeks.map(w=>`<span>${fshort(w)}</span>`).join('')}</div></div>${rows}</div><p class="muted small">Le trait corail marque aujourd'hui. Les dates se règlent dans chaque corps de métier.</p>`
   :empty('Rien à afficher','Ajoutez des dates à vos corps de métier pour les voir ici.',`<a class="btn primary" href="#/chantiers">Voir les chantiers</a>`));
}

function route(){const p=(location.hash.replace(/^#\/?/,'')||'accueil').split('/');return{name:p[0],id:p[1],tab:p[2]}}
let lastKey='';
function render(){
  const r=route();
  const views={accueil:vAccueil,chantiers:vChantiers,chantier:()=>vChantier(r),planning:vPlanning,devis:()=>vDocs('devis',r),factures:()=>vDocs('facture',r),reglages:vReglages};
  const key=r.name+'/'+(r.id||'');
  if(key!==lastKey){ui.q='';ui.opt=false}
  $('#main').innerHTML=(views[r.name]||vAccueil)();
  const on={chantier:'chantiers',planning:'chantiers'}[r.name]||r.name;
  const sec={chantiers:'chantiers',chantier:'chantiers',planning:'chantiers',devis:'devis',factures:'factures'}[r.name];
  if(sec)document.body.dataset.sec=sec;else delete document.body.dataset.sec;
  document.querySelectorAll('[data-n]').forEach(a=>a.classList.toggle('on',a.dataset.n===on));
  const m=$('#main');
  if(key!==lastKey){window.scrollTo(0,0);lastKey=key;m.classList.remove('enter');void m.offsetWidth;m.classList.add('enter')}
  if(ui.flash){ // petit rebond sur l'élément qui vient de changer
    const f=ui.flash;ui.flash=null;let el=null;
    if(f.startsWith('lot:'))el=$(`[data-a="cycleLot"][data-id="${f.slice(4)}"]`);
    else if(f==='line')el=[...document.querySelectorAll('#lines .line')].pop();
    else if(f==='st')el=$('.sumtop .pill');
    if(el)el.classList.add('pop');
  }
}
const go=h=>{if(location.hash==='#/'+h)render();else location.hash='#/'+h};

const actions={
  newChantier:()=>chantierForm(),editChantier:d=>chantierForm(ch(d.id)),
  delChantier:d=>{if(confirm('Supprimer ce chantier et ses corps de métier ? Les devis et factures sont conservés.')){db.lots=db.lots.filter(l=>l.chantierId!==d.id);db.docs.forEach(x=>{if(x.chantierId===d.id)x.chantierId=''});db.chantiers=db.chantiers.filter(c=>c.id!==d.id);save();$('#dlg').close();go('chantiers')}},
  newLot:d=>lotForm(null,d.id),editLot:d=>lotForm(lot(d.id)),
  delLot:d=>{if(confirm('Supprimer ce corps de métier ?')){db.lots=db.lots.filter(l=>l.id!==d.id);save();$('#dlg').close();render()}},
  cycleLot:d=>{const l=lot(d.id);l.status=STAT_L[(STAT_L.indexOf(l.status)+1)%STAT_L.length];save();ui.flash='lot:'+d.id;render()},
  newDoc:d=>newDoc(d.type,d.id),
  delDoc:d=>{if(confirm('Supprimer ce document définitivement ?')){const x=doc(d.id);db.docs=db.docs.filter(y=>y.id!==d.id);save();go(x.type==='devis'?'devis':'factures')}},
  addLine:d=>{doc(d.id).lines.push({desc:'',qty:1,unit:'u',pu:0});save();ui.flash='line';render();const ls=document.querySelectorAll('#lines .line');const i=ls[ls.length-1]&&ls[ls.length-1].querySelector('.desc');if(i)i.focus()},
  delLine:d=>{const x=doc(d.id);x.lines.splice(+d.i,1);if(!x.lines.length)x.lines.push({desc:'',qty:1,unit:'u',pu:0});save();render()},
  printDoc:d=>printDoc(doc(d.id)),
  setStatus:d=>{const x=doc(d.id);setField(x,'status',d.v);save();ui.flash='st';render()},
  devis2fac:d=>{const q=doc(d.id),t=today();const f={id:uid(),type:'facture',number:nextNumber('facture'),chantierId:q.chantierId,clientName:q.clientName,clientAddress:q.clientAddress,date:t,due:addDays(t,30),tva:q.tva,status:'brouillon',notes:'',paid:0,devisId:q.id,clientType:q.clientType||'particulier',clientSiren:q.clientSiren||'',nature:q.nature||'services',tvaDebits:!!q.tvaDebits,deliveryAddress:q.deliveryAddress||'',lines:q.lines.map(l=>({...l}))};db.docs.push(f);save();toast('Facture créée à partir du devis');go('factures/'+f.id)},
  gprev:()=>{ui.goff--;render()},gnext:()=>{ui.goff++;render()},gtoday:()=>{ui.goff=0;render()},
  closeDlg:()=>$('#dlg').close(),
  demo:()=>{if(!db.chantiers.length||confirm('Ajouter des données d\'exemple à vos données actuelles ?')){demo();render();toast('Exemple chargé')}},
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='aune-sauvegarde-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  import:()=>$('#file').click(),
  reset:()=>{if(confirm('Effacer toutes les données de cet appareil ? Pensez à exporter une sauvegarde avant.')){db=blank();save();go('accueil')}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&actions[t.dataset.a])actions[t.dataset.a](t.dataset,e)});
function setField(d,k,v){
  if(k==='tva'||k==='paid')v=parseFloat(v)||0;
  if(k==='tvaDebits')v=(v===true||v==='1');
  if(k==='clientSiren')v=String(v).replace(/\D/g,'').slice(0,9);
  d[k]=v;
  if(k==='clientName'&&v&&!d.clientSiren&&d.clientType!=='pro'){const o=db.docs.find(x=>x.id!==d.id&&x.clientName===v&&x.clientType==='pro');if(o){d.clientType='pro';d.clientSiren=o.clientSiren||''}}
  if(k==='status'&&v==='payée')d.paid=ttc(d);
  if(k==='chantierId'){const c=ch(v);if(c){if(!d.clientName)d.clientName=c.client||'';if(!d.clientAddress)d.clientAddress=c.address||''}}
  if(k==='clientName'&&v&&!d.clientAddress){const o=db.docs.find(x=>x.id!==d.id&&x.clientName===v&&x.clientAddress)||db.chantiers.find(c=>c.client===v&&c.address);if(o)d.clientAddress=o.clientAddress||o.address}
}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='gsel'){ui.gc=t.value;render();return}
  if(t.id==='file'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||!d.v)throw 0;if(confirm('Remplacer vos données actuelles par ce fichier ?')){db=normalize(d);save();go('accueil');toast('Données importées')}}catch(x){toast('Fichier non reconnu')}t.value=''};rd.readAsText(f);return}
  if(t.dataset.l==='desc'){ // prestation connue : reprend unité et prix
    const d=doc(t.dataset.id),l=d.lines[+t.dataset.i],k=catalog().get(String(t.value).trim().toLowerCase());
    if(k&&!(+l.pu)){l.unit=k.unit;l.pu=k.pu;save();render()}return}
  if(t.tagName==='SELECT'&&t.dataset.b){
    const d=doc(t.dataset.id);setField(d,t.dataset.b,t.value);save();
    if(['status','chantierId'].includes(t.dataset.b))render();
    else{
      if(t.dataset.b==='clientType')syncPro(d);
      if(t.dataset.b==='tva'){const f=$('#debitsField');if(f)f.hidden=!(+d.tva)}
      $('#tot').innerHTML=totalsHtml(d);$('#warn').innerHTML=warnHtml(d);
    }return}
  if(t.dataset.b==='clientName'){
    const d=doc(t.dataset.id),a=$('[data-b="clientAddress"]'),ty=$('[data-b="clientType"]'),sr=$('[data-b="clientSiren"]');
    if(a&&d.clientAddress)a.value=d.clientAddress;
    if(ty)ty.value=d.clientType==='pro'?'pro':'particulier';
    if(sr)sr.value=d.clientSiren||'';
    syncPro(d);$('#warn').innerHTML=warnHtml(d);
  }
  if(t.tagName==='SELECT'&&t.dataset.s){db.settings[t.dataset.s]=t.dataset.s==='tva'?+t.value:t.value;save()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.q){ui.q=t.value;$('#list').innerHTML=t.dataset.q==='chantiers'?listChantiers():listDocs(t.dataset.q);return}
  if(t.dataset.l!==undefined){const d=doc(t.dataset.id),l=d.lines[+t.dataset.i],k=t.dataset.l;l[k]=(k==='qty'||k==='pu')?(parseFloat(t.value)||0):t.value;save();$('#lt_'+t.dataset.i).textContent=eur((+l.qty||0)*(+l.pu||0));$('#tot').innerHTML=totalsHtml(d);return}
  if(t.dataset.b!==undefined&&t.tagName!=='SELECT'){const d=doc(t.dataset.id);setField(d,t.dataset.b,t.value);save();if(t.dataset.b==='paid')$('#tot').innerHTML=totalsHtml(d);if(t.dataset.b==='clientSiren')$('#warn').innerHTML=warnHtml(d);return}
  if(t.dataset.s!==undefined&&t.tagName!=='SELECT'){db.settings[t.dataset.s]=t.value;save()}
});
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details.more')&&route().id)ui.opt=e.target.open},true);

render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
