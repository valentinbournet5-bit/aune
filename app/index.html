<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AUNE · Devis, factures et projets</title>
<meta name="theme-color" content="#f8f7f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* Blanc cassé + pastels un peu flashy. Une couleur par univers :
   chantiers = lilas · devis = ciel · factures = menthe · alertes = corail · attention = citron */
:root{
  color-scheme:light;
  --bg:#f8f7f3;--card:#fff;--ink:#232733;--muted:#70758a;--line:#ebe8e0;--soft:#f2f0ea;
  --sky:#86c9ff;--mint:#72e3b4;--lilac:#bba3ff;--coral:#ff9d8f;--lemon:#ffdf6b;
  --sky-s:#e4f3ff;--mint-s:#dff8ee;--lilac-s:#ede7ff;--coral-s:#ffeae6;--lemon-s:#fff6d4;
  --sky-d:#0d5a94;--mint-d:#087349;--lilac-d:#5430c4;--coral-d:#b02f24;--lemon-d:#7a5d00;
  --shadow:0 10px 30px -16px rgba(35,39,51,.28);
  --p:var(--ink);--pt:#fff;
}
body[data-sec=chantiers]{--p:var(--lilac);--pt:var(--ink)}
body[data-sec=devis]{--p:var(--sky);--pt:var(--ink)}
body[data-sec=factures]{--p:var(--mint);--pt:var(--ink)}
body[data-sec=clients]{--p:var(--coral);--pt:var(--ink)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:30px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;margin:0;font-weight:750}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:14px}

/* Mise en page : barre latérale (PC) / barre du bas (téléphone) */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:26px 16px 20px;display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.1em;font-size:20px;padding:0 8px}
.side nav{display:grid;gap:4px}
.nv{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;font-weight:650;color:var(--ink)}
.nv .chip{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none}
.nv:hover{background:var(--soft)}
.nv.on{background:#fff;box-shadow:var(--shadow)}
.nv.set{margin-top:auto;color:var(--muted)}
.ico{width:21px;height:21px;flex:none}
main{padding:34px clamp(18px,4vw,52px) 90px;max-width:1220px;width:100%}
.mtop,.bottom{display:none}

/* Boutons */
.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 18px;cursor:pointer;font-weight:650;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--p);color:var(--pt);border-color:var(--p)}
.btn.sky{background:var(--sky);border-color:var(--sky)}.btn.mint{background:var(--mint);border-color:var(--mint)}.btn.lilac{background:var(--lilac);border-color:var(--lilac)}
.btn.link{border:0;background:none;text-decoration:underline;padding:10px 4px}
.btn.danger{color:var(--coral-d)}
.btn.sm{min-height:38px;padding:6px 14px;font-size:14px;border-radius:12px}
.icon-btn{border:0;background:none;cursor:pointer;font-size:24px;line-height:1;padding:6px 10px;border-radius:10px;color:var(--muted)}
.icon-btn:hover{color:var(--coral-d);background:var(--coral-s)}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.head .sub{color:var(--muted);margin-top:6px}
.head .sub::first-letter{text-transform:uppercase}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sec{display:flex;justify-content:space-between;align-items:center;margin:30px 0 12px}
.sec:first-child{margin-top:0}
.count{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:13px;font-weight:700}
.back{display:inline-block;margin-bottom:14px;color:var(--muted);font-weight:650}
.cols2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:28px;align-items:start}
.cols2.eq{grid-template-columns:1fr 1fr}
.stack{display:grid;gap:14px}

/* Tuiles d'action */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.tile{border:0;border-radius:24px;padding:18px 20px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;color:var(--ink);box-shadow:var(--shadow);min-height:88px}
.tile .plus{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:28px;font-weight:600;flex:none}
.tile b{display:block;font-size:19px}
.tile .ts{font-size:14px;opacity:.75}
.tile.sky{background:var(--sky)}.tile.mint{background:var(--mint)}.tile.lilac{background:var(--lilac)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.kpis.three{grid-template-columns:repeat(3,1fr);margin-bottom:22px}
.kpi{border-radius:18px;padding:14px 16px;display:block}
.locked [data-a=addLine],.locked [data-a=delLine]{display:none}
.locked input:disabled,.locked select:disabled,.locked textarea:disabled{opacity:.72;background:var(--soft)}
.kpibtn{border:0;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.kpi span{font-size:14px;opacity:.78}
.kpi b{display:block;font-size:23px;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi.sky{background:var(--sky-s)}.kpi.mint{background:var(--mint-s)}.kpi.lilac{background:var(--lilac-s)}.kpi.coral{background:var(--coral-s)}.kpi.lemon{background:var(--lemon-s)}

/* Listes */
.list,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.list{overflow:hidden}
.card{padding:20px}
.row{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);min-height:68px}
.row:first-child{border-top:0}
a.row:hover{background:var(--bg)}
.row .main{flex:1;min-width:0}
.row .dlrow{flex:none;padding:8px;color:var(--muted)}.row .dlrow:hover{background:var(--soft);color:var(--ink)}
.row .t{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s,.s{color:var(--muted);font-size:14px}
.row .amt{font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--ink);flex:none}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:700;background:var(--soft);color:var(--muted);border:0;white-space:nowrap}
.pill.info{background:var(--sky-s);color:var(--sky-d)}.pill.ok{background:var(--mint-s);color:var(--mint-d)}
.pill.warn{background:var(--lemon-s);color:var(--lemon-d)}.pill.bad{background:var(--coral-s);color:var(--coral-d)}
button.pill{cursor:pointer}
button.pill:hover{filter:brightness(.96)}
.bar2{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:10px}
.bar2 i{display:block;height:100%;background:var(--mint);border-radius:99px}

/* Cartes chantier */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ccard{display:block;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.ccard:hover{border-color:var(--ink)}
.ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cname{font-size:18px;font-weight:750;letter-spacing:-.01em;line-height:1.2}
.cfoot{margin-top:8px}

/* Page chantier */
.hero{background:var(--lilac-s);border:1px solid color-mix(in srgb,var(--lilac) 55%,#fff);border-radius:26px;padding:20px 24px 22px;margin-bottom:26px}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hero-top .back{margin:0}
.hero-main{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hero-main .av{width:58px;height:58px;border-radius:18px;font-size:20px;background:var(--lilac)}
.hero-main>div{flex:1;min-width:200px}
.hero .bar2{background:rgba(255,255,255,.75);height:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chips a,.chips span{background:rgba(255,255,255,.8);border-radius:99px;padding:4px 12px;font-size:14px;font-weight:600}
.stats{display:grid}
.stats div{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stats div:first-child{border-top:0;padding-top:0}
.stats div:last-child{padding-bottom:0}
.stats b{font-variant-numeric:tabular-nums;font-size:17px}

.empty{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:30px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.notice{background:var(--lemon-s);border-radius:16px;padding:12px 18px;margin-bottom:22px;font-weight:550}
.search{width:100%;max-width:420px;margin-bottom:18px}
[hidden]{display:none!important}
.warnbox{background:var(--lemon-s);color:var(--lemon-d);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:650;margin-top:14px}

/* Formulaires */
input:not([type]),input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;min-width:0;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:0}
textarea{resize:vertical}
label.f{display:grid;gap:5px;font-size:14px;color:var(--muted);font-weight:550}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
details.more>summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none;display:flex;align-items:center;gap:8px}
details.more>summary::before{content:"+";display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--lemon);font-weight:800}
details.more[open]>summary::before{content:"–"}
details.more>summary::-webkit-details-marker{display:none}
dialog{border:0;border-radius:26px;background:var(--bg);color:var(--ink);padding:0;width:min(540px,calc(100vw - 20px));max-height:calc(100dvh - 20px);box-shadow:0 30px 80px -20px rgba(35,39,51,.5)}
dialog::backdrop{background:rgba(35,39,51,.45)}
.dform{padding:24px;display:grid;gap:18px}
.dform h2{font-size:21px;font-weight:800}
.frow{display:flex;justify-content:flex-end;gap:10px}

/* Éditeur de devis / facture */
.editor{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"info side" "lines side" "opts side";gap:18px 28px;align-items:start}
.e-info{grid-area:info}.e-lines{grid-area:lines;container-type:inline-size}
@container (max-width:560px){
  .line{grid-template-columns:1fr 1fr 1fr}
  .line .ltot{grid-column:1/3}
  .line .icon-btn{justify-self:end}
}.e-side{grid-area:side;position:sticky;top:24px}.e-opts{grid-area:opts}
.line{display:grid;grid-template-columns:80px 92px 120px minmax(0,1fr) 40px;gap:10px;align-items:end;padding:14px;border-radius:16px;background:var(--bg);margin-bottom:10px}
.line>*{min-width:0}
.line .desc{grid-column:1/-1;background:#fff}
.line .ltot input{font-weight:750}
.line .icon-btn{align-self:end;height:46px}
.mini{display:grid;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.mini input{background:#fff}
.row .rside{display:grid;justify-items:end;gap:4px}
.racts{display:flex;gap:8px;align-items:center}
.tot{display:grid;gap:8px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between}
.tot .big{font-size:28px;font-weight:800;letter-spacing:-.02em;border-top:2px solid var(--ink);padding-top:12px;margin-top:4px}
.sumcard{background:var(--p);border-color:var(--p)}
body:not([data-sec]) .sumcard,body[data-sec=chantiers] .sumcard{background:#fff;border-color:var(--line)}
.sumtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:700}
.actions{display:grid;gap:10px;margin-top:20px}
.actions .btn{width:100%}
.sumcard .btn{background:#fff;border-color:transparent}
.sumcard .btn.primary{background:var(--ink);color:#fff}
.sumcard .tot .big{border-color:var(--ink)}

/* Planning */
.gantt{overflow:auto;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.g{display:grid;grid-template-columns:160px 1fr;min-width:780px;border-top:1px solid var(--line)}
.g:first-child{border-top:0}
.gl{position:sticky;left:0;z-index:2;background:var(--card);padding:9px 14px;font-size:14px;border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl.c{font-weight:750;background:var(--lilac-s)}
.gw{display:grid;grid-template-columns:repeat(8,1fr);font-size:13px;color:var(--muted)}
.gw span{padding:9px 8px;border-left:1px solid var(--line)}
.gt{position:relative;min-height:38px;background:repeating-linear-gradient(to right,transparent 0,transparent calc(12.5% - 1px),var(--line) calc(12.5% - 1px),var(--line) 12.5%)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--coral);z-index:1}
.gb{position:absolute;top:9px;height:20px;border-radius:7px;min-width:8px}
.gb.c{top:16px;height:6px;background:var(--ink)!important}
.gb.done{opacity:.4}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;z-index:50;font-weight:650}
#print{display:none}

/* Fenêtre moyenne : la barre latérale se réduit aux icônes pour laisser la place au contenu */
@media (min-width:821px) and (max-width:1239px){
  .shell{grid-template-columns:86px minmax(0,1fr)}
  .side{padding:22px 0;align-items:center;gap:20px}
  .side .lb{display:none}
  .logo{padding:0}
  .nv{padding:6px;justify-content:center}
  main{padding-left:clamp(18px,3vw,40px);padding-right:clamp(18px,3vw,40px)}
}
@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols2,.cols2.eq{grid-template-columns:minmax(0,1fr)}
  .editor{grid-template-columns:minmax(0,1fr);grid-template-areas:"info" "lines" "side" "opts"}
  .e-side{position:static}
}
@media (max-width:820px){
  .shell{display:block}
  .side{display:none}
  .mtop{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0}
  .mtop .gear{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#fff;border:1px solid var(--line)}
  .bottom{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:#fff;border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 14px 40px -12px rgba(35,39,51,.4)}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;font-size:12px;font-weight:650;color:var(--muted)}
  .bottom .ib{padding:4px 18px;border-radius:99px;display:grid;place-items:center}
  .bottom a.on{color:var(--ink)}
  .bottom a.on .ib{background:var(--c)}
  main{padding:18px 16px 120px}
  h1{font-size:26px}
  .quick{grid-template-columns:1fr}
  .tile{min-height:72px}
  .kpis.three{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .line{grid-template-columns:1fr 1fr 1fr;padding:12px}
  .line .ltot{grid-column:1/3}
  .line .icon-btn{justify-self:end}
  .row{flex-wrap:wrap}
  .racts{flex:0 0 100%;justify-content:flex-end}
  .hero{padding:16px}
}
/* Animations : discrètes, et seulement si le système ne demande pas de les réduire */
@media (prefers-reduced-motion:no-preference){
  .tile,.ccard,.btn,.nv,.row,.pill,.icon-btn{transition:transform .14s ease,border-color .14s ease,background-color .14s ease,box-shadow .14s ease}
  .tile:hover{transform:translateY(-2px)}
  .ccard:hover{transform:translateY(-2px)}
  .btn:active,.tile:active,.ccard:active,button.pill:active{transform:scale(.97)}
  /* un seul mouvement d'ensemble quand on change de page */
  main.enter{animation:enter .3s cubic-bezier(.2,.7,.2,1)}
  @keyframes enter{from{opacity:0;transform:translateY(10px)}}
  main.enter .bar2 i{transform-origin:left;animation:grow .8s .12s cubic-bezier(.2,.7,.2,1) both}
  @keyframes grow{from{transform:scaleX(0)}}
  /* réponses à une action */
  dialog[open]{animation:dlg .24s cubic-bezier(.2,.8,.2,1)}
  dialog[open]::backdrop{animation:fade .24s ease-out}
  @keyframes dlg{from{opacity:0;transform:translateY(16px) scale(.97)}}
  @keyframes fade{from{opacity:0}}
  .pop{animation:pop .4s cubic-bezier(.3,1.7,.5,1)}
  @keyframes pop{from{transform:scale(.7)}}
  .line.pop{animation:slidein .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes slidein{from{opacity:0;transform:translateY(-8px)}}
  .toast{animation:up .2s ease-out}
  @keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
}
@media print{
  body{background:#fff}
  .shell,.bottom,dialog,.toast{display:none!important}
  #print{display:block!important;color:#000;background:#fff;font:12.5px/1.45 system-ui,sans-serif}
}
#print .pg{max-width:780px;margin:0 auto}
#print table{width:100%;border-collapse:collapse;margin:18px 0}
#print th{text-align:left;border-bottom:2px solid #000;padding:6px 4px;font-size:12px}
#print td{border-bottom:1px solid #ccc;padding:7px 4px;vertical-align:top}
#print .r{text-align:right}
#print .hd{display:flex;justify-content:space-between;gap:24px}
#print h1{font-size:30px}
#print .sig{border:1px solid #000;height:90px;padding:6px;margin-top:20px;width:55%}
#print .tt{margin-left:auto;width:260px}
#print .tt div{display:flex;justify-content:space-between;padding:3px 0}
#print .tt .g2{border-top:2px solid #000;font-weight:700;font-size:15px;margin-top:4px;padding-top:6px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div>
    <div class="mtop" id="mtop"></div>
    <main id="main"></main>
  </div>
</div>
<nav class="bottom" id="bottom"></nav>
<dialog id="dlg"></dialog>
<div id="print"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
'use strict';
/* ============ Utilitaires ============ */
const $=(s,el=document)=>el.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const LS='aune.v1', DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
const D=s=>Date.parse(s+'T00:00:00Z');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const addDays=(s,n)=>new Date(D(s)+n*DAY).toISOString().slice(0,10);
const weekStart=s=>addDays(s,-((new Date(D(s)).getUTCDay()+6)%7));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);
const fdate=s=>s?new Date(D(s)).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}):'—';
const fshort=s=>s?new Date(D(s)).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',timeZone:'UTC'}):'';
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const hue=s=>{let h=0;for(const c of String(s||'x'))h=(h*31+c.charCodeAt(0))%360;return h};
const colorOf=s=>`hsl(${hue(s)} 85% 76%)`;
const PAL=['sky','mint','lilac','coral','lemon'];
const palOf=s=>PAL[hue(s)%5];
const initials=s=>{
  const skip=/^(m|mr|mme|mlle|me|et|de|du|des|la|le|les|d|l)\.?$/i;
  let w=String(s||'').split(/[\s/·\-]+/).filter(x=>/^[A-Za-zÀ-ÿ0-9]/.test(x)&&!skip.test(x));
  if(!w.length)w=String(s||'?').split(/\s+/).filter(Boolean);
  const r=w.length>1?w[0][0]+w[1][0]:(w[0]||'?').slice(0,2);
  return r.toUpperCase();
};
const av=(label,key)=>`<span class="av" style="background:var(--${palOf(key||label)})">${esc(initials(label))}</span>`;
const I={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 site:'<path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/>',
 doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 inv:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
 cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'
};
const ico=n=>`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const MARK='<svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#bba3ff"/><path d="M16 46 L32 16 L48 46" fill="none" stroke="#232733" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 53h28" stroke="#fff" stroke-width="4" stroke-dasharray="2 5"/></svg>';

/* ============ Données ============ */
const STAT_L=['à venir','en cours','terminé'];
const STAT_C=['à venir','en cours','en pause','terminé'];
const STAT_D=['brouillon','envoyé','accepté','refusé'];
const STAT_F=['brouillon','envoyée','payée'];
const TRADES=['Terrassement','Maçonnerie / Gros œuvre','Charpente','Couverture','Menuiserie','Plomberie','Électricité','Chauffage / Clim','Plâtrerie / Isolation','Carrelage','Peinture','Façade','Paysage / VRD','Autre'];
const tone=s=>({'en cours':'info','à venir':'','terminé':'ok','en pause':'warn','brouillon':'','envoyé':'info','envoyée':'info','accepté':'ok','refusé':'bad','payée':'ok','en retard':'bad','annulée':'bad'}[s]||'');
const pill=s=>`<span class="pill ${tone(s)}">${esc(s)}</span>`;
/* Vocabulaire : « chantier », « projet » ou « dossier » au choix (les données ne changent pas) */
const VOC={
 projet:{one:'projet',many:'projets',lot:'intervenant',lots:'intervenants',role:'Rôle ou métier',who:'Entreprise ou personne'},
 chantier:{one:'chantier',many:'chantiers',lot:'corps de métier',lots:'corps de métier',role:'Corps de métier',who:'Entreprise ou artisan'},
 dossier:{one:'dossier',many:'dossiers',lot:'intervenant',lots:'intervenants',role:'Rôle ou métier',who:'Entreprise ou personne'}};
const W=()=>VOC[(db.settings||{}).vocab]||VOC.projet,cap=x=>x.charAt(0).toUpperCase()+x.slice(1),Wc=()=>cap(W().one),Wcs=()=>cap(W().many);
const lotN=n=>n>1?W().lots:W().lot;
const blank=()=>({v:1,chantiers:[],lots:[],tasks:[],docs:[],clients:[],settings:{
  name:'',legal:'',siret:'',vatId:'',address:'',email:'',phone:'',iban:'',tvaMode:'franchise',tva:20,
  devisPrefix:'DEV',facturePrefix:'FAC',avoirPrefix:'AV',acomptePct:30,plafondCA:83600,tauxCot:'',
  insKind:'Garantie décennale',insName:'',insAddr:'',insPolicy:'',insZone:'France métropolitaine',
  conditions:"Paiement à 30 jours. En cas de retard : pénalités à 3 fois le taux d'intérêt légal et indemnité forfaitaire de recouvrement de 40 €."}});
const normalize=d=>{const b=blank();d.settings=Object.assign(b.settings,d.settings||{});['chantiers','lots','tasks','docs'].forEach(k=>d[k]=d[k]||[]);if(!d.clients){d.clients=[];seedClients(d)}return d};
/* Carnet de clients : se remplit à partir des devis, factures et chantiers existants (sans doublon, sans rien effacer) */
const nkey=n=>String(n||'').trim().toLowerCase();
function seedClients(d){
  const m=new Map((d.clients||[]).map(c=>[nkey(c.name),c]));
  const put=(name,o)=>{const k=nkey(name);if(!k)return;let c=m.get(k);
    if(!c){c={id:uid(),name:String(name).trim(),type:'particulier',siren:'',address:'',phone:'',email:'',notes:''};m.set(k,c)}
    ['address','phone','siren'].forEach(f=>{if(o[f]&&!c[f])c[f]=o[f]});if(o.type==='pro'){c.type='pro'}};
  (d.chantiers||[]).forEach(c=>put(c.client,{phone:c.phone}));
  [...(d.docs||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(x=>put(x.clientName,{address:x.clientAddress,siren:x.clientSiren,type:x.clientType}));
  d.clients=[...m.values()];
}
function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(d&&d.v)return normalize(d)}catch(e){}return blank()}
let db=load();
function save(){try{localStorage.setItem(LS,JSON.stringify(db))}catch(e){toast('Enregistrement impossible : stockage plein ou bloqué')}if(typeof syncMark==='function')syncMark()}
const ch=id=>db.chantiers.find(c=>c.id===id);
const lot=id=>db.lots.find(l=>l.id===id);
const doc=id=>db.docs.find(d=>d.id===id);

const ht=d=>r2((d.lines||[]).reduce((s,l)=>s+r2((+l.qty||0)*(+l.pu||0)),0));
const tva=d=>r2(ht(d)*(+d.tva||0)/100);
const ttc=d=>r2(ht(d)+tva(d));
/* Avoir = facture à montants négatifs liée à une facture (refId). Une fois émis, il réduit ce que le client doit encore. */
const creditOf=d=>d.avoir||d.type!=='facture'?0:r2(db.docs.filter(x=>x.avoir&&x.refId===d.id&&x.status!=='brouillon').reduce((a,x)=>a+ttc(x),0));
const reste=d=>Math.max(0,r2(ttc(d)+creditOf(d)-(+d.paid||0)));
const isCancelled=d=>d.type==='facture'&&!d.avoir&&d.status==='envoyée'&&creditOf(d)<0&&reste(d)===0;
/* Une facture émise n'est plus modifiable (seuls les règlements peuvent être saisis) ni supprimable : on la corrige par un avoir. */
const isLocked=d=>!!d&&d.type==='facture'&&d.status!=='brouillon';
const LOCK_OK=['paid','paidAt','status'];
const docLabel=d=>d.type==='devis'?'Devis':d.avoir?'Avoir':'Facture';
const isLate=d=>d.type==='facture'&&d.status==='envoyée'&&d.due&&d.due<today()&&reste(d)>0;
const dStatus=d=>isLate(d)?'en retard':isCancelled(d)?'annulée':d.status;
const lotsOf=c=>db.lots.filter(l=>l.chantierId===c.id);
const lotsDone=c=>lotsOf(c).filter(l=>l.status==='terminé').length;
const progOf=c=>{const n=lotsOf(c).length;return n?Math.round(lotsDone(c)/n*100):(c.status==='terminé'?100:0)};
function nextNumber(type,avoir){
  const pre=type==='devis'?db.settings.devisPrefix:avoir?(db.settings.avoirPrefix||'AV'):db.settings.facturePrefix, y=new Date().getFullYear();
  let max=0;db.docs.filter(d=>d.type===type&&!!d.avoir===!!avoir).forEach(d=>{const m=String(d.number||'').match(/-(\d{4})-(\d+)$/);if(m&&+m[1]===y)max=Math.max(max,+m[2])});
  return `${pre}-${y}-${String(max+1).padStart(3,'0')}`;
}
const clientNames=()=>[...new Set([...db.clients.map(c=>c.name),...db.chantiers.map(c=>c.client),...db.docs.map(d=>d.clientName)].filter(Boolean))];
const findClient=n=>{const k=nkey(n);return k?db.clients.find(c=>nkey(c.name)===k):null};
const clientById=id=>db.clients.find(c=>c.id===id);
const clientOf=d=>(d.clientId&&clientById(d.clientId))||findClient(d.clientName);
const docsOfClient=c=>db.docs.filter(d=>d.clientId===c.id||(!d.clientId&&nkey(d.clientName)===nkey(c.name)));
/* apprend le client depuis un document ou un chantier : crée la fiche si besoin, complète les champs vides */
function learnClient(d){
  if(!d||!nkey(d.clientName))return;
  let c=clientOf(d);
  if(!c){c={id:uid(),name:d.clientName.trim(),type:'particulier',siren:'',address:'',phone:'',email:'',notes:''};db.clients.push(c)}
  if(d.clientAddress&&!c.address)c.address=d.clientAddress;
  if(d.clientType==='pro'){c.type='pro';if(d.clientSiren&&!c.siren)c.siren=d.clientSiren}
  if(d.clientId!==c.id)d.clientId=c.id;
  save();
}
const catalog=()=>{const m=new Map();db.docs.forEach(d=>d.lines.forEach(l=>{if(l.desc&&+l.pu)m.set(l.desc.trim().toLowerCase(),l)}));return m};

/* ============ UI ============ */
const ui={q:'',goff:0,gc:'',opt:false,flash:null};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function fld(f,v){
  const req=f.req?'required':'';let inp;
  if(f.t==='select')inp=`<select name="${f.k}" ${req}>${f.o.map(o=>{const[a,b]=Array.isArray(o)?o:[o,o];return`<option value="${esc(a)}" ${String(a)===String(v)?'selected':''}>${esc(b)}</option>`}).join('')}</select>`;
  else if(f.t==='textarea')inp=`<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
  else inp=`<input name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'step="any" inputmode="decimal"':''} ${f.t==='tel'?'inputmode="tel"':''} ${f.list?`list="dl_${f.k}"`:''} value="${esc(v==null?'':v)}" ${req} ${f.auto?'autofocus':''}>${f.list?`<datalist id="dl_${f.k}">${f.list.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`:''}`;
  return `<label class="f ${f.full?'full':''}"><span>${f.l}</span>${inp}</label>`;
}
function form(title,fields,vals,onSave,openMore){
  const main=fields.filter(f=>!f.more), more=fields.filter(f=>f.more);
  const dlg=$('#dlg');
  dlg.innerHTML=`<form class="dform"><h2>${esc(title)}</h2><div class="fgrid">${main.map(f=>fld(f,vals[f.k])).join('')}</div>${more.length?`<details class="more" ${openMore?'open':''}><summary>Plus de détails</summary><div class="fgrid" style="margin-top:6px">${more.map(f=>fld(f,vals[f.k])).join('')}</div></details>`:''}<div class="frow"><button type="button" class="btn" data-a="closeDlg">Annuler</button><button class="btn primary">Enregistrer</button></div></form>`;
  $('form',dlg).addEventListener('submit',e=>{
    e.preventDefault();const fd=new FormData(e.target),v={};
    fields.forEach(f=>{const raw=fd.get(f.k);v[f.k]=f.t==='number'?(parseFloat(raw)||0):(raw==null?'':String(raw).trim())});
    onSave(v);dlg.close();render();
  });
  dlg.showModal();
}

/* ============ Vues ============ */
const head=(title,sub,btns)=>`<div class="head"><div><h1>${title}</h1>${sub?`<div class="sub">${sub}</div>`:''}</div><div class="btns">${btns||''}</div></div>`;
const empty=(t,p,b)=>`<div class="empty"><b>${t}</b>${p}${b?`<div>${b}</div>`:''}</div>`;
const kpi=(c,l,v,href)=>`<${href?'a href="'+href+'"':'div'} class="kpi ${c}"><span>${l}</span><b>${v}</b></${href?'a':'div'}>`;

function docRow(d,msg,inChantier){
  const c=inChantier?null:ch(d.chantierId);
  return `<a class="row" href="#/${d.type==='devis'?'devis':'factures'}/${d.id}">${av(d.clientName||'?',d.clientName||d.id)}<div class="main"><div class="t">${esc(d.clientName||'Client à renseigner')}</div><div class="s">${esc(msg||(docLabel(d)+' '+d.number+(c?' · '+c.name:'')+' · '+fdate(d.date)))}</div></div><div class="rside"><div class="amt">${eur(ttc(d))}</div>${msg?'':pill(dStatus(d))}</div>${msg?'':`<button class="icon-btn dlrow" data-a="dlRow" data-id="${d.id}" aria-label="Télécharger le PDF" title="Télécharger le PDF"><svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button>`}</a>`;
}
function chantierRow(c){
  const n=lotsOf(c).length,done=lotsDone(c);
  return `<a class="row" href="#/chantier/${c.id}" style="display:block"><div style="display:flex;gap:14px;align-items:center">${av(c.name,c.id)}<div class="main"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.client||'Client non renseigné')}${n?' · '+done+'/'+n+' terminés':''}</div></div>${pill(c.status)}</div>${n?`<div class="bar2"><i style="width:${progOf(c)}%"></i></div>`:''}</a>`;
}
function chantierCard(c){
  const n=lotsOf(c).length,done=lotsDone(c);
  return `<a class="ccard" href="#/chantier/${c.id}"><div class="ctop">${av(c.name,c.id)}${pill(c.status)}</div><div class="cname">${esc(c.name)}</div><div class="s">${esc(c.client||'Client non renseigné')}</div><div class="bar2"><i style="width:${progOf(c)}%"></i></div><div class="s cfoot">${n?`${done}/${n} ${lotN(n)} terminé${n>1?'s':''}`:'Aucun '+W().lot}${c.end?` · fin ${fshort(c.end)}`:''}</div></a>`;
}

function vAccueil(){
  const t=today(),s=db.settings;
  const quick=`<div class="quick">
    <button class="tile sky" data-a="newDoc" data-type="devis"><span class="plus">+</span><span><b>Devis</b><span class="ts">Préparer un devis</span></span></button>
    <button class="tile mint" data-a="newDoc" data-type="facture"><span class="plus">+</span><span><b>Facture</b><span class="ts">Facturer un client</span></span></button>
    <button class="tile lilac" data-a="newChantier"><span class="plus">+</span><span><b>${Wc()}</b><span class="ts">Suivre un nouveau ${W().one}</span></span></button></div>`;
  const dateTxt=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  if(!db.chantiers.length&&!db.docs.length){
    return head('Bonjour',dateTxt)+quick+
      `<div class="empty"><b>Rien pour l'instant</b>Commencez par un devis : il se transforme ensuite en facture en un clic.<div><button class="btn link" data-a="demo">Voir avec un exemple</button></div></div>`;
  }
  const todo=[];
  db.docs.filter(isLate).forEach(d=>todo.push({d,w:0,msg:'En retard · échue le '+fdate(d.due)}));
  db.docs.filter(d=>d.type==='devis'&&d.status==='accepté'&&!db.docs.some(f=>f.devisId===d.id&&!f.acompte)).forEach(d=>todo.push({d,w:1,msg:'Devis accepté · créer la facture'}));
  db.docs.filter(d=>d.type==='devis'&&d.status==='envoyé'&&d.date<=addDays(t,-7)).forEach(d=>todo.push({d,w:2,msg:'Sans réponse depuis '+Math.round((D(t)-D(d.date))/DAY)+' jours'}));
  db.docs.filter(d=>d.status==='brouillon').forEach(d=>todo.push({d,w:3,msg:docLabel(d)+' brouillon à terminer'}));
  todo.sort((a,b)=>a.w-b.w);
  const actifs=db.chantiers.filter(c=>c.status==='en cours');
  const aEnc=db.docs.filter(d=>d.type==='facture'&&d.status==='envoyée').reduce((x,d)=>x+reste(d),0);
  const late=db.docs.filter(isLate).reduce((x,d)=>x+reste(d),0);
  const att=db.docs.filter(d=>d.type==='devis'&&d.status==='envoyé').reduce((x,d)=>x+ttc(d),0);
  return head('Bonjour',dateTxt)+quick+
  `<div class="kpis">${kpi('mint','À encaisser',eur(aEnc),'#/factures')}${kpi('coral','En retard',eur(late),'#/factures')}${kpi('sky','Devis en attente',eur(att),'#/devis')}${kpi('lilac',Wcs()+' en cours',actifs.length,'#/chantiers')}</div>`+
  (backupDue()?`<div class="notice">${bkAge()} <button class="btn link" data-a="export">Exporter maintenant</button></div>`:'')+
  (!s.name?`<div class="notice">Ajoutez le nom de votre entreprise pour qu'il figure sur vos devis. <a href="#/reglages"><u>Ouvrir les réglages</u></a></div>`:'')+
  `<div class="cols2"><div><div class="sec"><h2>À traiter</h2></div>`+
  (todo.length?`<div class="list">${todo.slice(0,6).map(x=>docRow(x.d,x.msg)).join('')}</div>`:`<div class="empty">Tout est à jour.</div>`)+
  `</div><div><div class="sec"><h2>${Wcs()} en cours</h2><a href="#/chantiers"><u>Tous</u></a></div>`+
  (actifs.length?`<div class="list">${actifs.map(chantierRow).join('')}</div>`:`<div class="empty">Aucun ${W().one} en cours.</div>`)+`</div></div>`;
}

function listChantiers(){
  const q=ui.q.toLowerCase();
  const l=db.chantiers.filter(c=>!q||(c.name+' '+c.client+' '+c.address).toLowerCase().includes(q));
  if(!l.length)return empty(q?'Aucun résultat':'Aucun '+W().one,'Un '+W().one+' regroupe vos '+W().lots+', devis et factures.',q?'':`<button class="btn primary" data-a="newChantier">+ ${Wc()}</button>`);
  return [['en cours','En cours'],['à venir','À venir'],['en pause','En pause'],['terminé','Terminés']].map(([k,t])=>{
    const g=l.filter(c=>c.status===k);return g.length?`<div class="sec"><h2>${t}<span class="count">${g.length}</span></h2></div><div class="cards">${g.map(chantierCard).join('')}</div>`:''}).join('');
}
function vChantiers(){
  return head(Wcs(),'',`<a class="btn" href="#/planning">Planning</a><button class="btn primary" data-a="newChantier">+ ${Wc()}</button>`)+
  (db.chantiers.length>4?`<input class="search" type="search" placeholder="Rechercher un ${W().one} ou un client" data-q="chantiers" value="${esc(ui.q)}">`:'')+

  const c=ch(r.id);

    <div class="bar2"><i style="width:${progOf(c)}%"></i></div>
    <div class="s" style="margin-top:6px">${n?`${lotsDone(c)} ${lotN(lotsDone(c))} terminé${lotsDone(c)>1?'s':''} sur ${n}`:`Aucun ${W().lot} pour le moment`}</div>
    ${chips?`<div class="chips">${chips}</div>`:''}</div>
  <div class="cols2">
   <div><div class="sec"><h2>${cap(W().lots)}</h2><button class="btn sm lilac" data-a="newLot" data-id="${c.id}">+ Ajouter</button></div>`+
  (n?`<div class="list">${ls.map(l=>`<div class="row">${av(l.trade,l.trade)}<div class="main"><div class="t">${esc(l.trade)}</div><div class="s">${esc(l.company||'Entreprise non renseignée')}${l.start||l.end?' · '+fshort(l.start)+(l.end?' → '+fshort(l.end):''):''}</div></div><div class="racts">${l.phone?`<a class="btn sm" href="tel:${esc(l.phone.replace(/\s/g,''))}" aria-label="Appeler ${esc(l.company||l.trade)}">Appeler</a>`:''}<button class="pill ${tone(l.status)}" data-a="cycleLot" data-id="${l.id}" title="Toucher pour changer l'état">${l.status}</button><button class="btn sm" data-a="editLot" data-id="${l.id}" aria-label="Modifier">⋯</button></div></div>`).join('')}</div>`
   :empty('Aucun '+W().lot,'Ajoutez les personnes ou entreprises qui interviennent.',`<button class="btn primary" data-a="newLot" data-id="${c.id}">+ ${cap(W().lot)}</button>`))+
  (c.notes?`<div class="sec"><h2>Notes</h2></div><div class="card" style="white-space:pre-wrap">${esc(c.notes)}</div>`:'')+

function vPlanning(){

  const bar=(s,e,color,cls,title)=>{
    s=s||e;e=e||s;if(!s)return'';let l=(D(s)-D(ws))/DAY,w=(D(e)-D(s))/DAY+1;
    if(l+w<=0||l>=days)return'';if(l<0){w+=l;l=0}if(l+w>days)w=days-l;
    return `<div class="gb ${cls}" title="${esc(title)}" style="left:${l/days*100}%;width:${w/days*100}%;background:${color}"></div>`;

  (rows?`<div class="gantt"><div class="g"><div class="gl"></div><div class="gw">${weeks.map(w=>`<span>${fshort(w)}</span>`).join('')}</div></div>${rows}</div><p class="muted small">Le trait corail marque aujourd'hui. Les dates se règlent dans chaque ${W().lot}.</p>`

/* ============ Chiffre d'affaires et livre des recettes ============ */
/* Encaissements : facture payée = son TTC, sinon l'acompte saisi ; les acomptes déjà comptés via leur propre facture sont retirés de la facture finale. */
const acSumFor=d=>d.devisId&&!d.acompte?db.docs.filter(x=>x.devisId===d.devisId&&x.acompte&&x.status==='payée').reduce((a,x)=>a+ttc(x),0):0;
function recettes(year){
  const out=[];
  db.docs.filter(d=>d.type==='facture'&&d.status!=='brouillon').forEach(d=>{
    let amt,date;
    if(d.avoir){const o=doc(d.refId);if(!o||o.status!=='payée')return;amt=ttc(d);date=d.date}
    else{const gross=d.status==='payée'?ttc(d):(+d.paid||0);amt=r2(Math.max(0,gross-(gross>0?acSumFor(d):0)));date=d.paidAt||d.date}
    if(!amt||!date||String(date).slice(0,4)!==String(year))return;
    const r=+d.tva||0,tv=r2(amt*r/(100+r));
    out.push({date,number:d.number,client:d.clientName||'',nature:{services:'Prestation de services',biens:'Vente de marchandises',mixte:'Vente et prestation'}[d.nature||'services']+(d.avoir?' (avoir)':''),ttc:amt,tva:tv,ht:r2(amt-tv)});
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date)||a.number.localeCompare(b.number));
}
const caYears=()=>{const y=new Set([new Date().getFullYear()]);db.docs.forEach(d=>{const x=String(d.paidAt||d.date||'').slice(0,4);if(/^\d{4}$/.test(x))y.add(+x)});return [...y].sort((a,b)=>b-a)};
const caTotal=year=>r2(recettes(year).reduce((a,x)=>a+x.ht,0));
function caDialog(year){
  const s=db.settings,rs=recettes(year),ca=caTotal(year),micro=s.tvaMode==='franchise',plaf=+s.plafondCA||0,taux=parseFloat(s.tauxCot)||0;

function recettesCsv(year){
  const f=n=>String(n.toFixed(2)).replace('.',','),q=t=>'"'+String(t).replace(/"/g,'""')+'"',rs=recettes(year);
  const rows=[['Date d\'encaissement','N° de facture','Client','Nature','Montant HT','TVA','Montant TTC encaissé']].map(r=>r.map(q).join(';'))
    .concat(rs.map(x=>[x.date.split('-').reverse().join('/'),x.number,x.client,x.nature,f(x.ht),f(x.tva),f(x.ttc)].map(q).join(';')))
    .concat([['Total '+year,'','','',f(r2(rs.reduce((a,x)=>a+x.ht,0))),f(r2(rs.reduce((a,x)=>a+x.tva,0))),f(r2(rs.reduce((a,x)=>a+x.ttc,0)))].map(q).join(';')]);
  return '\ufeff'+rows.join('\r\n')+'\r\n';
}

const UNIT_CODE={'u':'C62','unité':'C62','unite':'C62','forfait':'C62','pièce':'C62','piece':'C62','m':'MTR','ml':'MTR','m²':'MTK','m2':'MTK','m³':'MTQ','m3':'MTQ','h':'HUR','heure':'HUR','j':'DAY','jour':'DAY','kg':'KGM','l':'LTR','t':'TNE'};

function facturxXml(d){
  const s=db.settings,rate=+d.tva||0,franchise=!rate&&s.tvaMode==='franchise';
  const cat=rate?'S':franchise?'O':'Z';
  const ls=d.lines.filter(l=>l.desc||l.pu).map(l0=>{const l=d.avoir?{...l0,qty:Math.abs(+l0.qty||0),pu:Math.abs(+l0.pu||0)}:l0;return {l,tot:r2((+l.qty||0)*(+l.pu||0))}});
  const basis=r2(ls.reduce((a,x)=>a+x.tot,0)),tax=r2(basis*rate/100),grand=r2(basis+tax);
  const prepaid=Math.min(r2(+d.paid||0),grand),due=r2(grand-prepaid);
  const siren=String(s.siret||'').replace(/\s/g,'').slice(0,9),siret=String(s.siret||'').replace(/\s/g,'');
  const reason=franchise?'TVA non applicable, art. 293 B du CGI':'';
  const nat={services:'Prestation de services',biens:'Livraison de biens',mixte:'Livraison de biens et prestation de services'}[d.nature||'services'];

/* PDF de qualité (polices intégrées, PDF/A-3). Facture pro : Factur-X (XML embarqué). Renvoie null si des infos manquent. */
async function pdfFile(d,plain){
  const fx=needFx(d)&&!plain&&isPro();
  fxTip=needFx(d)&&!plain&&!isPro();
  if(fx){const miss=facturxCheck(d);if(miss.length){missingDlg(miss,d);return null}}
  if(!window.FXPDF){await loadJs('fx-fonts.js');await loadJs('fx-pdf.js')}
  const bytes=await FXPDF.build(pdfModel(d,fx),fx?facturxXml(d):null);
  return new File([bytes],String(d.number).replace(/[^\w.-]+/g,'_')+(fx?'-factur-x':'')+'.pdf',{type:'application/pdf'});
}
async function docSend(d,plain){

    if(!f){sendBusy=false;return}
    const s=db.settings,isD=d.type==='devis',text=`Bonjour,\n\nVeuillez trouver ci-joint ${isD?'notre devis':'notre facture'} n° ${d.number} d'un montant de ${eur(ttc(d))} TTC.\n\nCordialement,\n${s.name||''}`;

        if(d.status==='brouillon'){if(isD)actions.setStatus({id:d.id,v:'envoyé'});else toast('Partagée. Marquez-la comme envoyée quand elle est bonne : elle sera alors verrouillée')}}

  }finally{sendBusy=false}
}

}

  if(k==='tvaDebits')v=(v===true||v==='1');

  d[k]=v;
  if(k==='clientName'){const c=findClient(v);d.clientId=c?c.id:'';if(c){if(!d.clientAddress&&c.address)d.clientAddress=c.address;if(c.type==='pro'&&d.clientType!=='pro'){d.clientType='pro';d.clientSiren=c.siren||''}else if(c.type==='pro'&&!d.clientSiren)d.clientSiren=c.siren||''}}

  if(k==='status'){if(v==='payée'){d.paid=ttc(d);if(!d.paidAt)d.paidAt=today()}else d.paidAt=''}

    if(sy.dirty){
      const mut=syMut,{status,j}=await syApi('/api/data','PUT',{rev:sy.rev||0,data:db});
      if(status===200){sy.rev=j.rev;sy.at=Date.now();if(mut===syMut)sy.dirty=false;else again=true;syKeep()}
      else if(status===409)syConflict(j);
      else if(status===402){sy.me={...(sy.me||{}),plan:'free',until:0};syKeep();toast('La synchronisation fait partie de la formule Pro')}
      else if(manual||status===413)toast(status===413?'Données trop volumineuses pour la synchronisation':'Synchronisation impossible pour le moment');
    }else{
      const {status,j}=await syApi('/api/data','GET');
      if(status===200){
        if(j.rev>(sy.rev||0)&&j.data){if(!busyUi()||manual)adopt(j.data,j.rev);else{syBusy=false;return}}
        else if(j.rev===0&&!isBlank(db)){sy.dirty=true;syBusy=false;return syncNow(manual)}
        else{sy.at=Date.now();syKeep()}
        if(manual)toast('Synchronisé')
      }else if(manual)toast('Synchronisation impossible pour le moment');
    }
  }catch(e){if(manual)toast('Pas de réseau pour le moment')}
  syBusy=false;syPaint();
  if(again&&!syPending)syT=setTimeout(()=>syncNow(),500);
}
function syConflict(srv){
  if(isBlank(db)){adopt(srv.data,srv.rev);toast('Données en ligne récupérées');return}
  syPending=srv;
  const n=d=>{d=normalize(d);return `${d.chantiers.length} ${d.chantiers.length>1?W().many:W().one}, ${d.docs.length} devis/factures`};
  const dlg=$('#dlg');
  dlg.innerHTML=`<div class="dform"><h2>Deux versions de vos données</h2><p>Cet appareil et la version en ligne sont différents. Laquelle garder ?</p>
  <p style="margin:0"><b>Cet appareil</b> : ${esc(n(db))}</p><p style="margin:4px 0 14px"><b>En ligne</b> (${esc(ago(srv.updated))}) : ${esc(n(srv.data))}</p>
  <div class="frow"><button type="button" class="btn" data-a="syKeepOnline">Reprendre la version en ligne</button><button type="button" class="btn primary" data-a="syKeepLocal">Garder cet appareil</button></div></div>`;
  if(!dlg.open)dlg.showModal();syPaint();
}
function syResolve(keepLocal){
  const srv=syPending;if(!srv)return;syPending=null;$('#dlg').close();
  if(keepLocal){sy.rev=srv.rev;sy.dirty=true;syKeep();syncNow(true)}else adopt(srv.data,srv.rev);
}
async function syLogin(){
  const el=$('#syEmail')||$('#proEmail'),email=(el&&el.value||'').trim();
  if(!/^\S+@\S+\.\S{2,}$/.test(email)){toast('Entrez une adresse e-mail valide');if(el)el.focus();return}
  try{
    const {status,j}=await syApi('/api/login','POST',{email});
    if(status===200){if($('#proEmail'))$('#dlg').close();toast('Lien envoyé : ouvrez votre e-mail');if(j.link)console.info('[test] '+j.link)}
    else toast(status===429?'Trop de demandes : réessayez dans une heure':'Envoi impossible pour le moment');
  }catch(e){toast('Pas de réseau pour le moment')}
}
async function syLogout(){
  try{await syApi('/api/logout','POST')}catch(e){}
  sy={};syKeep();toast('Déconnecté. Vos données restent sur cet appareil');render();
}
async function syDelete(){
  if(!confirm('Supprimer définitivement votre compte et toutes vos données en ligne ? Vos données restent sur cet appareil, mais ne seront plus synchronisées. Cette action est irréversible.'))return;
  try{const {status}=await syApi('/api/account/delete','POST',{});
    if(status===200){sy={};syKeep();toast('Compte supprimé. Vos données restent sur cet appareil');render()}
    else if(status===409)toast('Résiliez d\'abord votre abonnement (Gérer mon abonnement), puis supprimez le compte');
    else toast('Suppression impossible pour le moment')}
  catch(e){toast('Pas de réseau pour le moment')}
}
async function checkLink(){
  const r=route();if(r.name!=='connexion'||!r.id||!API)return;
  const t=r.id;history.replaceState(null,'',location.pathname+location.search+'#/reglages');render();
  try{
    const {status,j}=await syApi('/api/verify','POST',{token:t});
    if(status===200){sy={s:j.session,e:j.email,rev:0,dirty:!isBlank(db)};syKeep();await meRefresh();toast('Connecté');render();syncNow()}
    else toast('Lien expiré ou déjà utilisé : demandez-en un nouveau')
  }catch(e){toast('Pas de réseau pour le moment')}
}
$('#dlg').addEventListener('cancel',e=>{if(syPending)e.preventDefault()}); // le choix de version ne se ferme pas par Échap
window.addEventListener('online',()=>syncNow());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){syncNow()}else if(sy.dirty){clearTimeout(syT);syncNow()}});

render();
checkLink();checkAbo();syncNow();if(route().name==='reglages'&&sy.s)meRefresh();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
